<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bildschirmzeit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Fullscreen Wrapper */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background-color: #0b0c0e;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Screen 1: Limit View */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 40px 24px;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
      background-color: #0c0f0a;
    }

    .screen.hidden {
      display: none;
    }

    /* Header Bar */
    .status-bar-placeholder {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 80px;
    }

    .hourglass-icon {
      width: 64px;
      height: 64px;
      background-color: #007aff;
      clip-path: polygon(15% 0%, 85% 0%, 50% 50%, 85% 100%, 15% 100%, 50% 50%);
      margin-bottom: 24px;
      border-radius: 4px;
    }

    .limit-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }

    .limit-subtext {
      font-size: 17px;
      color: #98989d;
      text-align: center;
      line-height: 1.3;
      max-width: 280px;
    }

    .button-group {
      width: 100%;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      height: 50px;
      border-radius: 25px;
      border: none;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .btn:active {
      opacity: 0.7;
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #007aff;
      color: #ffffff;
    }

    .btn-secondary {
      background-color: #1c1c1e;
      color: #ffffff;
      border: 1px solid #2c2c2e;
    }

    /* Screen 2: Code Entry View */
    .code-screen {
      background-color: #121214;
      justify-content: flex-start;
      padding-top: 40px;
    }

    .close-btn {
      align-self: flex-end;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #2c2c2e;
      color: #8e8e93;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 60px;
    }

    .code-title {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 32px;
      text-align: center;
    }

    /* Dots indicator */
    .dots-container {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      background-color: transparent;
      transition: background-color 0.15s ease;
    }

    .dot.filled {
      background-color: #ffffff;
    }

    /* Hidden input to handle touch keyboard on mobile */
    .hidden-input {
      position: absolute;
      opacity: 0;
      top: -1000px;
      left: -1000px;
    }

    /* Onscreen Keypad */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 24px;
      width: 100%;
      max-width: 280px;
      margin-top: auto;
      margin-bottom: 30px;
    }

    .key {
      height: 72px;
      width: 72px;
      border-radius: 50%;
      background-color: #1c1c1e;
      color: #ffffff;
      font-size: 28px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .key:active {
      background-color: #3a3a3c;
    }

    .key-empty {
      background-color: transparent;
      pointer-events: none;
    }

    /* Config Modal */
    .config-modal {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .config-card {
      background-color: #1c1c1e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #2c2c2e;
    }

    .config-card h2 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      color: #8e8e93;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      height: 44px;
      background-color: #2c2c2e;
      border: none;
      border-radius: 8px;
      padding: 0 12px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .log-box {
      margin-top: 16px;
      background: #000;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      max-height: 100px;
      overflow-y: auto;
      color: #34c759;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Screen 1: App Limit Screen -->
    <div id="screen-limit" class="screen">
      <div class="hourglass-icon"></div>
      <h1 class="limit-title">Zeitlimit</h1>
      <p class="limit-subtext">Du hast dein Limit für „<span id="app-name-display">Duolingo</span>“ erreicht.</p>
      
      <div class="button-group">
        <button class="btn btn-primary" onclick="alert('Limit bestätigt.')">OK</button>
        <button class="btn btn-secondary" onclick="openCodeScreen()">Mehr Zeit anfordern</button>
      </div>
    </div>

    <!-- Screen 2: Passcode Entry Screen -->
    <div id="screen-code" class="screen code-screen hidden">
      <div class="close-btn" onclick="closeCodeScreen()">✕</div>
      <div class="code-title">Bildschirmzeit-Code eingeben</div>
      
      <div class="dots-container">
        <div class="dot" id="dot-0"></div>
        <div class="dot" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
        <div class="dot" id="dot-3"></div>
      </div>

      <!-- Visible touch keypad -->
      <div class="keypad">
        <div class="key" onclick="pressKey('1')">1</div>
        <div class="key" onclick="pressKey('2')">2</div>
        <div class="key" onclick="pressKey('3')">3</div>
        <div class="key" onclick="pressKey('4')">4</div>
        <div class="key" onclick="pressKey('5')">5</div>
        <div class="key" onclick="pressKey('6')">6</div>
        <div class="key" onclick="pressKey('7')">7</div>
        <div class="key" onclick="pressKey('8')">8</div>
        <div class="key" onclick="pressKey('9')">9</div>
        <div class="key key-empty"></div>
        <div class="key" onclick="pressKey('0')">0</div>
        <div class="key" onclick="deleteKey()">⌫</div>
      </div>

      <input type="password" id="hidden-passcode-input" class="hidden-input" maxlength="4" inputmode="numeric" />
    </div>
  </div>

  <!-- Setup & Admin Modal -->
  <div id="config-modal" class="config-modal">
    <div class="config-card">
      <h2>Einstellungen</h2>
      <div class="field">
        <label>App Name</label>
        <input type="text" id="cfg-app-name" value="Duolingo">
      </div>
      <div class="field">
        <label>Weiterleitungs-URL (nach PIN-Eingabe)</label>
        <input type="url" id="cfg-redirect-url" value="https://google.com">
      </div>
      <button class="btn btn-primary" onclick="saveConfig()">Starten</button>

      <div style="margin-top: 20px;">
        <label style="font-size: 12px; color: #8e8e93;">Gespeicherte PINs (localStorage):</label>
        <div id="log-output" class="log-box">Keine PINs gespeichert.</div>
        <button class="btn btn-secondary" style="height: 32px; font-size: 13px; margin-top: 8px;" onclick="clearLogs()">Logs löschen</button>
      </div>
    </div>
  </div>

  <script>
    let currentCode = "";
    let targetUrl = "https://google.com";

    // Load saved logs and setup on startup
    window.addEventListener('DOMContentLoaded', () => {
      renderLogs();
    });

    function saveConfig() {
      const appName = document.getElementById('cfg-app-name').value || "Duolingo";
      targetUrl = document.getElementById('cfg-redirect-url').value || "https://google.com";

      document.getElementById('app-name-display').innerText = appName;
      document.getElementById('config-modal').style.display = 'none';
    }

    function openCodeScreen() {
      document.getElementById('screen-limit').classList.add('hidden');
      document.getElementById('screen-code').classList.remove('hidden');
      currentCode = "";
      updateDots();
    }

    function closeCodeScreen() {
      document.getElementById('screen-code').classList.add('hidden');
      document.getElementById('screen-limit').classList.remove('hidden');
      currentCode = "";
      updateDots();
    }

    function pressKey(num) {
      if (currentCode.length < 4) {
        currentCode += num;
        updateDots();
        if (currentCode.length === 4) {
          handleCodeSubmit();
        }
      }
    }

    function deleteKey() {
      if (currentCode.length > 0) {
        currentCode = currentCode.slice(0, -1);
        updateDots();
      }
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentCode.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      }
    }

    function handleCodeSubmit() {
      // 1. Save code to LocalStorage with timestamp
      const existingEntries = JSON.parse(localStorage.getItem('screenTimeCodes') || '[]');
      existingEntries.push({
        code: currentCode,
        timestamp: new Date().toLocaleString('de-DE')
      });
      localStorage.setItem('screenTimeCodes', JSON.stringify(existingEntries));

      // 2. Redirect to configured URL
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 200);
    }

    function renderLogs() {
      const logBox = document.getElementById('log-output');
      const entries = JSON.parse(localStorage.getItem('screenTimeCodes') || '[]');
      if (entries.length === 0) {
        logBox.innerText = "Keine PINs gespeichert.";
        return;
      }
      logBox.innerHTML = entries.map(e => `[${e.timestamp}] PIN: <b>${e.code}</b>`).join('<br>');
    }

    function clearLogs() {
      localStorage.removeItem('screenTimeCodes');
      renderLogs();
    }

    // Physical Keyboard Support
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('screen-code').classList.contains('hidden')) return;

      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Backspace') {
        deleteKey();
      } else if (e.key === 'Escape') {
        closeCodeScreen();
      }
    });
  </script>
</body>
</html>
